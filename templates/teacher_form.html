{% extends 'base.html' %}
{% block title %}{{ 'Edit' if teacher else 'Add' }} Teacher — Student Management{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>{{ 'Edit Teacher' if teacher else 'Add Teacher' }}</h1><p>Teacher information and subject assignment.</p></div><a class="button" href="{{ url_for('teachers') }}">Back</a></div>
<form method="post" class="card form-card"><div class="form-grid two"><div><label>Teacher Name *</label><input name="name" value="{{ teacher.name if teacher else '' }}" required></div><div><label>Subject *</label><select name="subject_id" required><option value="">Select subject</option>{% for s in subjects %}<option value="{{ s.id }}" {% if teacher and teacher.subject_id == s.id %}selected{% endif %}>{{ s.code }} — {{ s.name }}</option>{% endfor %}</select></div><div><label>Phone</label><input name="phone" value="{{ teacher.phone if teacher else '' }}"></div><div><label>Email</label><input type="email" name="email" value="{{ teacher.email if teacher else '' }}"></div><div><label>Qualification</label><input name="qualification" value="{{ teacher.qualification if teacher else '' }}"></div><div><label>Status</label><select name="status">{% for v in ['Active','Inactive'] %}<option {% if (teacher.status if teacher else 'Active') == v %}selected{% endif %}>{{ v }}</option>{% endfor %}</select></div></div><div class="form-actions"><a class="button" href="{{ url_for('teachers') }}">Cancel</a><button class="button primary" type="submit">Save Teacher</button></div></form>
{% endblock %}
